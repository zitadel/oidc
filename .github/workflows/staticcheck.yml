name: Staticcheck
on:
  push:
    branches:
      - "2.11.x"
      - main
      - next
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staticcheck:
    runs-on: ubuntu-24.04
    name: Staticcheck (${{ matrix.build-tags || 'default' }})
    strategy:
      fail-fast: false
      matrix:
        build-tags:
          - ""
          - no_otel
          - create_regression_data
    steps:
      - uses: actions/checkout@v7
      - name: Setup go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: dominikh/staticcheck-action@v1.4.1
        with:
          version: "2026.2.1"
          install-go: false
          build-tags: ${{ matrix.build-tags }}
          cache-key: ${{ matrix.build-tags }}
